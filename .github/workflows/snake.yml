# Draws the contribution graph as an animated snake and publishes the SVGs
# to the `output` branch, which the profile README embeds.
name: Contribution snake

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#179299&color_dots=#ebedf0,#a6e3d8,#5fcfbf,#20a596,#137980
            dist/snake-dark.svg?palette=github-dark&color_snake=#94e2d5&color_dots=#161b22,#1f4f4a,#2d7a70,#4fb3a5,#94e2d5

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
